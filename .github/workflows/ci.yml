name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cli,        run: 'node tests/test-cli.mjs',          timeout: 15 }
          - { name: client,     run: 'npm test',                        timeout: 15 }
          - { name: compiler,   run: 'npx tsx tests/test-compiler.ts',  timeout: 15 }
          - { name: edge,       run: 'npx tsx tests/test-edge.ts',      timeout: 15 }
          - { name: harness,    run: 'npx tsx tests/test-harness.ts',   timeout: 15 }
          - { name: pack,       run: 'node tests/test-pack.mjs',        timeout: 15 }
          - { name: dev-als,    run: 'node tests/test-dev-als.mjs',     timeout: 15 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          SAFE_DELETE_ENABLED: "0"
          CI: "true"

  platforms:
    name: ${{ matrix.group }} exports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [miniprogram, mobile, desktop, rust, webview, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export and compile ${{ matrix.group }} targets
        run: npx tsx tests/test-platforms.ts ${{ matrix.group }}
        env:
          SAFE_DELETE_ENABLED: "0"
          CARGO_NET_OFFLINE: "true"
