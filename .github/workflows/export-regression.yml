name: Export regression

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  export-regression:
    name: export regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full export assertion suite
        run: npx tsx tests/test-export.ts
        env:
          SAFE_DELETE_ENABLED: "0"
