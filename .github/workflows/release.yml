name: Release

on:
  push:
    tags: ['v*']

# id-token: write is what npm's trusted publishing exchanges for a short-lived
# publish token - no NPM_TOKEN secret lives in this repository.
permissions:
  contents: write
  id-token: write

# The release is gated on CI: a tag alone does not publish anything. The
# test job runs the same suites as the CI workflow, and the release job
# waits for it - so a red build never produces a release.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: CLI test suite
        # SAFE_DELETE_ENABLED=0: the dev safety shim blocks bulk deletes with a
        # confirmation prompt that has no stdin in CI.
        run: node tests/test-cli.mjs
        env:
          SAFE_DELETE_ENABLED: "0"
          CI: "true"

      - name: Example build + client pipeline tests
        run: npm test
        env:
          SAFE_DELETE_ENABLED: "0"

      - name: Universal export tests
        # Exports the demo to a mini-program project and EXECUTES the generated
        # page JS in a sandbox; no platform SDK is needed.
        run: npx tsx tests/test-export.ts
        env:
          SAFE_DELETE_ENABLED: "0"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes need every tag and the commits between them
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # the newest 22.x: a pinned 22.14.0 was too old for current npm, and
          # the tests themselves run in the job above, on their own version.
          # No registry-url: that writes `_authToken=${NODE_AUTH_TOKEN}` into
          # .npmrc, and with no token to fill it npm sent an empty credential and
          # answered E401 before it ever tried the OIDC exchange.
          node-version: 22
      - name: Upgrade npm for trusted publishing
        # npm 11 is the line that carries both features this workflow needs -
        # trusted publishing (>= 11.5.1) and staged publishing (>= 11.15) - and
        # it still runs on node 22. `npm@latest` now resolves to 12, which wants
        # node ^22.22.2 || ^24.15 || >=26 and refused to install here.
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Drop any inherited npm credential
        run: |
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_auth 2>/dev/null || true
      # id-token: write is what mints these; printing presence (never the value)
      # is the difference between "the OIDC path was never available" and "npm
      # rejected the publisher configured on npmjs.com".
      - name: Show the OIDC surface
        run: |
          for v in ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!v}" ]; then echo "$v present"; else echo "$v MISSING"; fi
          done
          npm --version
      # Staged, never live: `npm stage publish` puts the tarball in the staging
      # area and a maintainer approves it with 2FA (`npm stage approve <id>`, or
      # the Staged Packages tab on npmjs.com). The version is the tag's own, so a
      # v0.2.1 tag stages rosezm@0.2.1. npm attaches the provenance attestation
      # itself, so there is no --provenance flag to keep in sync.
      - name: Stage the package on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          # A staged tarball still becomes a version nobody can replace, and a
          # mistyped tag would stage the wrong one under the right-looking name.
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME but package.json says $version" >&2
            exit 1
          fi
          if npm view "rosezm@$version" version >/dev/null 2>&1; then
            echo "rosezm@$version is already live on npm - nothing to stage"
          else
            npm stage publish
          fi
      - run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          # every release so far ships as a pre-release
          prerelease: true
