# rosezm - Rust release build (GitHub Actions).
#
# `rosezm export rust` copies this file into the export tree as
# .github/workflows/rust.yml. The binary is std-only with zero dependencies,
# so the build needs nothing but the toolchain - and because the artifact is
# ONE binary per OS, the matrix is targets, not runners.
#
# No credential is written into this file; there is nothing to sign - the
# artifact is a binary you scp and run.

name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl needs the linker on the runner; the vendor targets do not.
      - name: install musl tools (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Release: the binary is shipped, not debugged, and the asset table is
      # already in memory - size is the only axis that matters here.
      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: rosezm-rust-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.os == 'windows-latest' && 'rosezm.exe' || 'rosezm' }}
          if-no-files-found: error
