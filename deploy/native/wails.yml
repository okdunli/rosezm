# rosezm - Wails build (GitHub Actions).
#
# `rosezm export wails` copies this file into the export tree as
# .github/workflows/wails.yml, at the root of the exported project, so every
# path below is the project's own. The frontend is already built and embedded,
# so there is no npm step - just Go and the Wails CLI.
#
# No credential is written into this file. Codesigning/notarization for macOS
# reads its material from ${{ secrets.NAME }} - see DEPLOY.md, the manual step.

name: Wails

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Linux needs the webview2/gtk dev packages wails links against; the other
      # two platforms need nothing beyond the OS default.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install the wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: resolve the wails module
        run: go mod tidy

      - name: wails build
        run: wails build

      - uses: actions/upload-artifact@v4
        with:
          name: rosezm-wails-${{ matrix.platform }}
          path: |
            build/bin/*
          if-no-files-found: error
