# rosezm - Tauri build (GitHub Actions).
#
# `rosezm export tauri` copies this file into the export tree as
# .github/workflows/tauri.yml. The frontend ships prebuilt under frontend/,
# so the tauri.conf.json has no beforeBuildCommand - the workflow only needs
# Rust and the Tauri CLI.
#
# No credential is written into this file. The updater and signing read their
# material from ${{ secrets.NAME }} - see DEPLOY.md, the manual step.

name: Tauri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      # Linux needs the webkit2gtk dev packages Tauri links against.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The core plugin is required by v2's capability system (capabilities/default.json).
      - name: add the tauri CLI
        run: cargo install tauri-cli --version '^2'

      - name: tauri build
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: rosezm-tauri-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error
